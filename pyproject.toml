[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mp3-quality-scanner"
version = "0.1.0"
description = "Automated MP3 integrity and audio quality analysis"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "numpy>=2.0,<3.0",
    "scipy>=1.14,<2.0",
    "typer>=0.15,<1.0",
    "rich>=13.9,<15.0",
    "pydantic-settings>=2.7,<3.0",
    "scipy-stubs~=1.18.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
mp3qs = "mp3_quality_scanner.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mp3_quality_scanner"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["mp3_quality_scanner"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
files = ["src/mp3_quality_scanner"]
warn_unused_configs = true

[tool.uv]
package = true
